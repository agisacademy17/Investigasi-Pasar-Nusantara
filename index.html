        // Generator Nada Sintetis Cadangan (Fallback Web Audio API)
        let audioCtxInstance = null;
        const getAudioContext = () => {
            if (!audioCtxInstance) {
                audioCtxInstance = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtxInstance.state === 'suspended') {
                audioCtxInstance.resume();
            }
            return audioCtxInstance;
        };

        const playFallbackTone = (type) => {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                const now = ctx.currentTime;
                if (type === 'click') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(660, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'success') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    osc.frequency.setValueAtTime(1046.50, now + 0.3);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                    osc.start(now);
                    osc.stop(now + 0.55);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) {}
        };

        // Pemutar Suara Utama
        const playAudioTone = (type) => {
            try {
                if (type === 'success') {
                    const audio = new Audio(SOUND_CORRECT_URL);
                    audio.volume = 0.85;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => playFallbackTone('success'));
                    }
                    return;
                }
                if (type === 'error') {
                    const audio = new Audio(SOUND_WRONG_URL);
                    audio.volume = 0.85;
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => playFallbackTone('error'));
                    }
                    return;
                }
                playFallbackTone(type);
            } catch (e) {
                playFallbackTone(type);
            }
        };

        // Manajemen Musik Latar Belakang (BGM)

        const playBgm = () => {
            try {
                if (!bgmAudioInstance) {
                    bgmAudioInstance = new Audio(BGM_URL);
                    bgmAudioInstance.loop = true;
                    bgmAudioInstance.volume = 0.4;
                }
                if (bgmAudioInstance.paused) {
                    const playPromise = bgmAudioInstance.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(() => {});
                    }
                }
            } catch (e) {}
        };

        const stopBgm = () => {
            try {
                if (bgmAudioInstance) {
                    bgmAudioInstance.pause();
                }
            } catch (e) {}
        };

        const toggleBgm = () => {
            try {
                if (!bgmAudioInstance) {
                    playBgm();
                    return true;
                }
                if (bgmAudioInstance.paused) {
                    bgmAudioInstance.play().catch(() => {});

                } else {

        // Enkripsi & Dekripsi Sandi Angka Aljabar (A=1, B=2, ..., Z=26, Spasi=0)
        const encodeNameToCipher = (text) => {
            if (!text) return '';
            return text.toUpperCase().split('').map(char => {
                const code = char.charCodeAt(0);
                if (code >= 65 && code <= 90) return (code - 64).toString();
                if (code >= 48 && code <= 57) return `#${char}`;
                if (char === ' ') return '0';
                return '';
            }).filter(Boolean).join('-');
        };

        const decodeCipherToName = (cipher) => {
            if (!cipher) return '';
            const parts = cipher.trim().replace(/\s+/g, '-').split(/[-.,/|\s]+/);
            return parts.map(p => {
                if (!p) return '';
                if (p === '0') return ' ';
                if (p.startsWith('#')) return p.substring(1);
                const num = parseInt(p, 10);
                if (!isNaN(num) && num >= 1 && num <= 26) {
                    return String.fromCharCode(64 + num);
                }
                return p;
            }).join('');
        };

        const Scratchpad = ({ isOpen, onClose }) => {
            const canvasRef = useRef(null);
            const isDrawingRef = useRef(false);

            useEffect(() => {
                if (!isOpen) return;
                const canvas = canvasRef.current;
                if (!canvas) return;
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                const ctx = canvas.getContext('2d');
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.85)';
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
            }, [isOpen]);

            const getCoordinates = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                if (e.touches && e.touches.length > 0) {
                    return {
                        x: e.touches[0].clientX - rect.left,
                        y: e.touches[0].clientY - rect.top
                    };
                }
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                isDrawingRef.current = true;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const { x, y } = getCoordinates(e);
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const endDrawing = () => {
                isDrawingRef.current = false;
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.beginPath();
            };

            const draw = (e) => {

                const { x, y } = getCoordinates(e);
                ctx.lineTo(x, y);
                ctx.stroke();
            };

                playAudioTone('click');
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            };

                        <div className="text-center mb-6 max-w-xl bg-black/45 backdrop-blur-md px-6 py-3.5 rounded-3xl border border-white/20 shadow-2xl">
                            <div className="inline-flex items-center gap-2 bg-emerald-500/20 text-emerald-300 px-3.5 py-1 rounded-full text-xs font-bold uppercase tracking-wider mb-1.5 border border-emerald-400/40">
                                <i className="fas fa-id-card-clip"></i> Markas Detektif Nusantara
                            </div>
                            <h2 className="text-2xl sm:text-3xl font-serif font-bold text-white">Pilih Karakter & Identitas</h2>
                            <p className="text-xs sm:text-sm text-gray-200 mt-1">
                                Pilih salah satu karakter detektif di bawah ini. Ketika Anda memasukkan nama, karakter akan dinamai dengan <b>Nama Sandi Angka Detektif</b> Anda.
                            </p>
                        </div>

                        <div className="w-full max-w-3xl bg-white/95 dark:bg-gray-800/95 backdrop-blur-md p-5 sm:p-6 rounded-3xl shadow-2xl border-2 border-emerald-500/40 dark:border-emerald-500/30 mb-6 flex flex-col md:flex-row items-center gap-6">
                            <div className="flex flex-col items-center shrink-0">
                                <div className={`w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br ${activeChar.avatarBg} text-white flex items-center justify-center text-4xl sm:text-5xl shadow-lg ring-4 ring-emerald-300 dark:ring-emerald-700 bounce-slight transition-all duration-300 overflow-hidden relative`}>
                                    {activeChar.image ? (
                                        <img 
                                            src={activeChar.image} 
                                            alt="Karakter Terpilih"
                                            className="w-full h-full object-cover"
                                            onError={(e) => {
                                                e.target.onerror = null;
                                                if (activeChar.fallbackImage) {
                                                    e.target.src = activeChar.fallbackImage;
                                                }
                                            }}
                                        />
                                    ) : (
                                        <i className={`fas ${activeChar.icon}`}></i>
                                    )}
                                </div>
                            </div>

                            <div className="flex-1 w-full space-y-3 text-left">
                                <div className="border-b dark:border-gray-700 pb-2">
                                    <div className="flex flex-wrap items-center justify-between gap-2">
                                        <div>
                                            <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 block mb-0.5">
                                                Nama Sandi Karakter:
                                            </span>
                                            <h3 className="text-xl sm:text-2xl font-bold font-serif text-gray-900 dark:text-gray-100 flex items-center gap-2 flex-wrap">
                                                {inputName.trim() && generatedCipher ? (
                                                    <span className="font-mono text-emerald-600 dark:text-emerald-400 font-black tracking-wide">
                                                        Sandi {generatedCipher}
                                                    </span>
                                                ) : (
                                                    <span className="text-gray-400 dark:text-gray-500 italic text-base sm:text-lg">
                                                        (Masukkan nama Anda di bawah)
                                                    </span>
                                                )}
                                            </h3>
                                            {inputName.trim() && (
                                                <p className="text-[11px] text-gray-500 dark:text-gray-400 mt-0.5">
                                                    Nama Murid: <b className="text-gray-800 dark:text-gray-200">{inputName}</b>
                                                </p>
                                            )}
                                        </div>
                                        <span className="text-xs bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-bold px-2.5 py-1 rounded-xl flex items-center gap-1.5 border border-amber-300">
                                            <i className="fas fa-medal text-amber-500"></i> {activeChar.badge}
                                        </span>
                                    </div>
                                    <p className="text-xs text-gray-500 dark:text-gray-400 italic mt-1">"{activeChar.quote}"</p>
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-gray-700 dark:text-gray-300 mb-1">
                                        Masukkan Nama Murid / Detektif:
                                    </label>
                                    <div className="relative">
                                        <input 
                                            type="text" 
                                            value={inputName}
                                            onChange={(e) => setInputName(e.target.value)}
                                            placeholder="Ketik nama Anda di sini..."
                                            className="w-full p-3 pl-10 rounded-xl border-2 border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-900 focus:border-emerald-500 outline-none font-bold text-sm sm:text-base text-gray-800 dark:text-gray-100 shadow-inner"
                                            maxLength="22"
                                        />
                                        <i className="fas fa-user-secret absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                    </div>
                                </div>

                                <div className="bg-slate-900 text-amber-300 p-3 rounded-2xl border border-amber-500/40 shadow-inner">
                                    <div className="flex items-center justify-between text-[11px] text-gray-400 font-semibold mb-1">
                                        <span className="flex items-center gap-1 text-amber-400">
                                            <i className="fas fa-key"></i> Sandi Angka Rahasia Detektif (A=1..Z=26):
                                        </span>
                                        <span className="text-[10px] bg-amber-500/20 px-2 py-0.5 rounded text-amber-300 font-mono">Terenkripsi</span>
                                    </div>
                                    <div className="font-mono text-base font-extrabold tracking-widest break-all text-amber-300 bg-black/40 p-2 rounded-xl border border-slate-700 text-center">
                                        {generatedCipher || "---"}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="w-full max-w-4xl mb-8">
                            <div className="flex items-center justify-between mb-3 px-1">
                                <span className="text-xs font-bold uppercase tracking-wider text-white bg-black/40 backdrop-blur-sm px-3 py-1 rounded-full border border-white/20">
                                    Pilihan 10 Karakter Detektif:
                                </span>
                                <span className="text-xs font-extrabold text-white bg-emerald-700/80 backdrop-blur-sm px-2.5 py-1 rounded-full border border-white/20">
                                    {CHARACTERS.findIndex(c => c.id === selectedCharId) + 1} dari 10
                                </span>
                            </div>

                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3.5">
                                {CHARACTERS.map((char, index) => {
                                    const isSelected = char.id === selectedCharId;

                                    return (
                                        <button
                                            key={char.id}
                                            type="button"
                                            onClick={() => handleSelectChar(char)}
                                            className={`p-2.5 rounded-2xl border-2 transition-all duration-200 relative group flex items-center justify-center
                                                ${isSelected 
                                                    ? 'bg-emerald-50 dark:bg-emerald-950/80 border-emerald-500 ring-4 ring-emerald-300/60 dark:ring-emerald-800 scale-105 shadow-xl' 
                                                    : 'bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border-gray-200 dark:border-gray-700 hover:border-emerald-300 hover:shadow-md'
                                                }`}
                                        >
                                            {isSelected && (
                                                <span className="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-emerald-600 text-white text-[10px] flex items-center justify-center font-black border-2 border-white shadow z-10">
                                                    <i className="fas fa-check"></i>
                                                </span>
                                            )}

                                            <div className="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-gradient-to-br from-emerald-600 to-teal-800 text-white flex items-center justify-center text-3xl shadow group-hover:scale-105 transition-transform overflow-hidden relative">
                                                {char.image ? (
                                                    <img 
                                                        src={char.image} 
                                                        alt={`Karakter ${index + 1}`}
                                                        className="w-full h-full object-cover"
                                                        onError={(e) => {
                                                            e.target.onerror = null;
                                                            if (char.fallbackImage) {
                                                                e.target.src = char.fallbackImage;
                                                            }
                                                        }}
                                                    />
                                                ) : (
                                                    <i className={`fas ${char.icon}`}></i>
                                                )}
                                            </div>
                                        </button>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="w-full max-w-md">
                            <button 
                                onClick={handleContinue} 
                                disabled={!inputName.trim()}
                                className={`w-full font-bold py-4 px-8 rounded-2xl transition-all shadow-lg flex justify-center items-center gap-2 text-base ${
                                    inputName.trim() 
                                        ? 'bg-emerald-600 hover:bg-emerald-700 hover:scale-105 active:scale-95 text-white' 
                                        : 'bg-gray-300 dark:bg-gray-700 text-gray-500 cursor-not-allowed'
                                }`}
                            >
                                <span>Tetapkan Detektif & Lanjut ke Pasar</span>
                                <i className="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const RegionSelect = ({ state, setState, changeScreen }) => (
            <div className="relative min-h-[85vh] w-full flex flex-col items-center justify-center p-4 sm:p-6 fade-in">
                <div 
                    className="fixed inset-0 bg-cover bg-center bg-no-repeat z-0 pointer-events-none transform scale-105 transition-transform duration-1000"
                    style={{ 
                        backgroundImage: `url('https://lh3.googleusercontent.com/d/1b2W3kWoFwXqkEbAub2uRljfgA7b9waMw')`
                    }}
                >
                    <div className="absolute inset-0 bg-gradient-to-b from-black/50 via-black/35 to-black/65 backdrop-blur-[1px]"></div>
                </div>

                <div className="relative z-10 flex flex-col items-center max-w-4xl w-full">
                    <div className="text-center mb-6 bg-black/45 backdrop-blur-md px-6 py-3.5 rounded-3xl border border-white/20 shadow-2xl">
                        <div className="inline-flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-widest text-emerald-400 mb-0.5">
                            <i className="fas fa-map-location-dot"></i> Wilayah Kasus Nusantara
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-serif font-bold text-white">Pilih Lokasi Investigasi</h2>
                        <p className="text-xs sm:text-sm text-gray-200 mt-0.5">Setiap daerah memiliki komoditas, dialek, dan suasana pasar yang unik.</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
                        {Object.values(REGIONS).map(reg => (
                            <div 
                                key={reg.id}
                                onClick={() => {
                                    playAudioTone('click');
                                    setState(s => ({ ...s, region: reg.id }));
                                    changeScreen('map');
                                }}
                                className={`cursor-pointer rounded-3xl overflow-hidden shadow-2xl border-2 transition-all duration-300 transform hover:scale-105 active:scale-95
                                    ${state.region === reg.id ? 'border-emerald-400 ring-4 ring-emerald-400/50' : 'border-white/30 hover:border-emerald-300'}
                                    bg-white/95 dark:bg-gray-900/95 backdrop-blur-md flex flex-col`}
                            >
                                <div className="h-36 bg-gradient-to-br from-emerald-600 via-teal-700 to-emerald-950 flex items-center justify-center text-5xl text-emerald-100 shadow-inner relative overflow-hidden">
                                    {reg.image ? (
                                        <div className="w-full h-full relative group">
                                            <img 
                                                src={reg.image} 
                                                alt={reg.name}
                                                className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500"
                                                onError={(e) => {
                                                    e.target.onerror = null;
                                                    if (reg.fallbackImage) {
                                                        e.target.src = reg.fallbackImage;
                                                    }
                                                }}
                                            />
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-black/20 pointer-events-none"></div>
                                            <div className="absolute bottom-2 right-2 bg-black/60 backdrop-blur-sm text-white px-2.5 py-0.5 rounded-lg text-[10px] font-bold flex items-center gap-1 border border-white/20">
                                                <i className={`fas ${reg.icon}`}></i> {reg.name}
                                            </div>
                                        </div>
                                    ) : (
                                        <i className={`fas ${reg.icon} drop-shadow-md`}></i>
                                    )}
                                </div>
                                <div className="p-5 flex-1 flex flex-col justify-between">
                                    <div>
                                        <div className="text-xs font-bold uppercase text-emerald-600 dark:text-emerald-400 tracking-wider mb-1 flex items-center gap-1.5">
                                            <i className="fas fa-location-dot"></i> Kasus Aktif
                                        </div>
                                        <h3 className="text-xl font-bold mb-2 font-serif text-gray-900 dark:text-gray-100">{reg.name}</h3>
                                        <div className="flex flex-wrap gap-2 text-xs mb-3">
                                            <span className="bg-emerald-50 dark:bg-emerald-950/80 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 px-2.5 py-1 rounded-xl font-bold">
                                                <i className="fas fa-box mr-1"></i> {reg.commodity}
                                            </span>
                                            <span className="bg-amber-50 dark:bg-amber-950/80 text-amber-700 dark:text-amber-300 border border-amber-200 dark:border-amber-800 px-2.5 py-1 rounded-xl font-bold">
                                                <i className="fas fa-coins mr-1"></i> {reg.currency}
                                            </span>
                                        </div>
                                    </div>
                                    <p className="text-xs italic text-gray-600 dark:text-gray-300 bg-gray-100/90 dark:bg-gray-800/90 p-2.5 rounded-xl border border-gray-200/80 dark:border-gray-700 mt-1">
                                        "{reg.greeting}, Detektif!"
                                    </p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );

        const GameMap = ({ state, changeScreen }) => {
            const region = REGIONS[state.region];
            const currentProgress = state.progress; 
            const [animStep, setAnimStep] = useState(0);

            useEffect(() => {
                let current = 0;
                const timer = setInterval(() => {
                    current += 1;
                    setAnimStep(current);
                    if (current > LEVELS.length * 2) clearInterval(timer);
                }, 350);
                return () => clearInterval(timer);
            }, []);

            const pathCoordinates = [
                { x: 20, y: 11 },
                { x: 78, y: 28 },
                { x: 24, y: 46 },
                { x: 78, y: 64 },
                { x: 22, y: 81 }
            ];

            return (
                <div className="flex flex-col items-center min-h-[85vh] p-4 fade-in font-sans overflow-hidden relative pb-10">
                    <div className="w-full max-w-4xl flex justify-center items-center p-4 rounded-2xl shadow-md mb-6 bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm border border-gray-200 dark:border-gray-700 z-30 relative text-center">
                        <div>
                            <h2 className="text-xl sm:text-2xl font-bold font-serif text-gray-900 dark:text-white tracking-wide">{region?.name || "Peta Investigasi"}</h2>
                            <p className="text-xs sm:text-sm text-emerald-600 dark:text-emerald-400 font-extrabold uppercase tracking-widest flex items-center justify-center gap-1.5 mt-0.5">
                                <i className="fas fa-route"></i> Rute Investigasi Pasar
                            </p>
                        </div>
                    </div>

                    <div className="relative z-10 w-full max-w-4xl h-[720px] sm:h-[840px] rounded-3xl bg-[#ece6d9]/90 dark:bg-slate-900/90 backdrop-blur-sm shadow-2xl overflow-hidden border-4 border-[#d5cabb] dark:border-slate-700">
                        <img 
                            src="https://lh3.googleusercontent.com/d/11hy1Sc5CZyV0BUZppDah68SMDWVHvaiL"
                            alt="Peta Investigasi HD"
                            className="absolute inset-0 w-full h-full object-cover z-0 pointer-events-none"
                            onError={(e) => {
                                e.target.onerror = null;
                                e.target.src = "https://drive.google.com/thumbnail?id=11hy1Sc5CZyV0BUZppDah68SMDWVHvaiL&sz=w1600";
                            }}
                        />
                        <div className="absolute inset-0 bg-black/15 dark:bg-black/40 z-0 pointer-events-none"></div>

                        <svg 
                            viewBox="0 0 100 100" 
                            className="absolute inset-0 w-full h-full z-[1] pointer-events-none" 
                            preserveAspectRatio="none"
                        >
                            <defs>
                                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                                    <feGaussianBlur stdDeviation="0.8" result="blur" />
                                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                                </filter>

                                {LEVELS.map((_, i) => {
                                    if (i === LEVELS.length - 1) return null;
                                    const start = pathCoordinates[i];
                                    const end = pathCoordinates[i+1];
                                    const cpx = (start.x + end.x) / 2;
                                    const pathD = `M ${start.x} ${start.y} C ${cpx} ${start.y}, ${cpx} ${end.y}, ${end.x} ${end.y}`;
                                    const isDrawn = animStep >= (i * 2) + 2;

                                    return (
                                        <mask id={`route-draw-mask-${i}`} key={`mask-${i}`}>
                                            <path 
                                                d={pathD}
                                                fill="none"
                                                stroke="white"
                                                strokeWidth="12"
                                                pathLength="100"
                                                strokeDasharray="100"
                                                strokeDashoffset={isDrawn ? 0 : 100}
                                                style={{ transition: 'stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1)' }}
                                            />
                                        </mask>
                                    );
                                })}
                            </defs>

                            {LEVELS.map((_, i) => {
                                if (i === LEVELS.length - 1) return null;
                                const start = pathCoordinates[i];
                                const end = pathCoordinates[i+1];
                                const cpx = (start.x + end.x) / 2;
                                const pathD = `M ${start.x} ${start.y} C ${cpx} ${start.y}, ${cpx} ${end.y}, ${end.x} ${end.y}`;
                                const isUnlockedRoute = currentProgress > i;

                                return (
                                    <g key={`route-segment-${i}`} mask={`url(#route-draw-mask-${i})`}>
                                        <path 
                                            d={pathD}
                                            fill="none"
                                            stroke="rgba(0,0,0,0.12)"
                                            strokeWidth="5"
                                            strokeLinecap="round"
                                            vectorEffect="non-scaling-stroke"
                                        />
                                        <path 
                                            d={pathD}
                                            fill="none"
                                            stroke={isUnlockedRoute ? "#10b981" : "#9ca3af"}
                                            strokeWidth={isUnlockedRoute ? "3.5" : "2.5"}
                                            strokeDasharray={isUnlockedRoute ? "8 6" : "6 6"}
                                            strokeLinecap="round"
                                            vectorEffect="non-scaling-stroke"
                                            filter={isUnlockedRoute ? "url(#glow)" : undefined}
                                            className="transition-colors duration-700"
                                        />
                                    </g>
                                );
                            })}
                        </svg>

                        {LEVELS.map((lvl, index) => {
                            const levelNum = index + 1;
                            const isUnlocked = currentProgress >= levelNum;
                            const isCurrent = currentProgress === levelNum;
                            const isCompleted = currentProgress > levelNum;
                            const isVisible = animStep >= (index * 2) + 1;
                            const pos = pathCoordinates[index];

                            return (
                                <div 
                                    key={lvl.id}
                                    className="absolute z-10"
                                    style={{
                                        left: `${pos.x}%`, 
                                        top: `${pos.y}%`,
                                        transform: 'translate(-50%, -50%)'
                                    }}
                                >
                                    <div className={`transition-all duration-700 ease-out transform origin-center
                                        ${isVisible ? 'scale-100 opacity-100' : 'scale-0 opacity-0'}
                                    `}>
                                        <button
                                            onClick={() => {
                                                if (isUnlocked) {
                                                    playAudioTone('click');
                                                    changeScreen(lvl.id);
                                                }
                                            }}
                                            disabled={!isUnlocked}
                                            className="relative group flex flex-col items-center justify-center cursor-pointer outline-none select-none"
                                        >
                                            <div className={`w-20 h-20 sm:w-24 sm:h-24 flex items-center justify-center relative transition-all duration-300 shadow-xl
                                                ${!isUnlocked 
                                                    ? 'bg-gray-900/90 border-b-[6px] border-black rounded-[30%_70%_50%_50%/50%_40%_60%_50%] scale-90 opacity-75' 
                                                    : isCurrent
                                                    ? 'bg-gradient-to-b from-[#f3dbab] to-[#dab370] border-b-[7px] border-[#b88e4a] rounded-[40%_60%_50%_50%/50%_50%_60%_40%] scale-110 ring-4 ring-yellow-400/70 bounce-slight' 
                                                    : 'bg-gradient-to-b from-[#e3d3b8] to-[#c7b293] border-b-[7px] border-[#a89273] rounded-[45%_55%_60%_40%/55%_45%_50%_50%] hover:scale-105' 
                                                }
                                            `}>
                                                <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center text-lg sm:text-xl shadow-inner relative z-10 
                                                    ${!isUnlocked 
                                                        ? 'bg-gray-800 text-gray-500 border border-gray-700' 
                                                        : isCurrent 
                                                        ? 'bg-white text-yellow-700 shadow-md ring-2 ring-yellow-300'
                                                        : 'bg-white text-emerald-700'}`}>
                                                    
                                                    {isCompleted && (
                                                        <div className="absolute -top-2.5 -right-2.5 bg-emerald-500 text-white rounded-full w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center border-2 border-white shadow-lg z-20 text-[11px] sm:text-xs">
                                                            <i className="fas fa-check"></i>
                                                        </div>
                                                    )}

                                                    {!isUnlocked ? (
                                                        <i className="fas fa-lock"></i>
                                                    ) : isCompleted ? (
                                                        <i className={`fas ${lvl.icon} opacity-70`}></i>
                                                    ) : (
                                                        <i className={`fas ${lvl.icon}`}></i>
                                                    )}
                                                </div>
                                            </div>

                                            <div className={`absolute top-full mt-3 w-40 sm:w-44 bg-white/95 dark:bg-gray-800/95 backdrop-blur-sm p-2 rounded-xl shadow-xl border text-center transition-all duration-300 pointer-events-none z-20
                                                ${isCurrent 
                                                    ? 'opacity-100 border-yellow-400 scale-100' 
                                                    : 'opacity-0 group-hover:opacity-100 translate-y-1 group-hover:translate-y-0 border-gray-200 dark:border-gray-700 scale-95'}
                                                ${!isUnlocked && 'hidden'}
                                            `}>
                                                <span className="block text-[10px] uppercase font-black text-yellow-600 dark:text-yellow-400 tracking-wider">Level {levelNum}</span>
                                                <span className="block text-xs font-bold text-gray-800 dark:text-gray-100 leading-tight truncate">{lvl.title}</span>
                                            </div>
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-6 flex flex-wrap justify-center items-center gap-6 bg-white/90 dark:bg-gray-800/90 backdrop-blur-sm px-6 py-3 rounded-2xl shadow-md border border-gray-200 dark:border-gray-700 z-10 relative text-xs">
                        <div className="flex items-center gap-2">
                            <i className="fas fa-check-circle text-emerald-500 text-base"></i> 
                            <span className="font-bold text-gray-700 dark:text-gray-200">Selesai</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <i className="fas fa-location-dot text-yellow-500 text-base animate-bounce"></i> 
                            <span className="font-bold text-yellow-600 dark:text-yellow-400">Kasus Aktif</span>
                        </div>
                        <div className="flex items-center gap-2">
                            <i className="fas fa-lock text-gray-400 text-base"></i> 
                            <span className="font-bold text-gray-400">Terkunci</span>
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessPopup = ({ levelNum, onContinue }) => (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-md flex items-center justify-center z-50 fade-in p-4">
                <div className="bg-white dark:bg-gray-800 rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl transform scale-100 transition-transform border border-emerald-500/30">
                    <div className="w-20 h-20 bg-yellow-100 dark:bg-yellow-900/50 rounded-full mx-auto mb-4 flex items-center justify-center text-5xl text-yellow-500 bounce-slight">
                        <i className="fas fa-star"></i>
                    </div>
                    <h2 className="text-2xl font-bold mb-2 text-gray-900 dark:text-white">Luar Biasa!</h2>
                    <p className="opacity-80 text-sm mb-6 text-gray-600 dark:text-gray-300">Bukti kejanggalan berhasil dikumpulkan. Anda menyelesaikan Level {levelNum}.</p>
                    <button onClick={() => { playAudioTone('click'); onContinue(); }} className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-md transition-colors active:scale-95">
                        Lanjutkan <i className="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        );

        const WrongPopup = ({ title, message, onRetry, lives }) => {
            useEffect(() => {
                playAudioTone('error');
            }, []);

            return (
                <div className="fixed inset-0 bg-black/65 backdrop-blur-md flex items-center justify-center z-50 fade-in p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-7 max-w-sm w-full text-center shadow-2xl border-2 border-rose-500/50">
                        <div className="w-20 h-20 bg-rose-100 dark:bg-rose-950/60 rounded-full mx-auto mb-3 flex items-center justify-center text-5xl text-rose-500 bounce-slight">
                            <i className="fas fa-circle-xmark"></i>
                        </div>
                        <h2 className="text-2xl font-bold mb-1 text-gray-900 dark:text-white">{title || "Coba Lagi!"}</h2>
                        
                        {/* Indikator Pengurangan Nyawa */}
                        <div className="flex items-center justify-center gap-1.5 mb-3 bg-rose-50 dark:bg-rose-950/40 py-1.5 px-3 rounded-full border border-rose-200 dark:border-rose-900/60 w-fit mx-auto">
                            <span className="text-xs font-bold text-rose-700 dark:text-rose-300 mr-1">Sisa Nyawa:</span>
                            {[1, 2, 3].map(heartIndex => (
                                <i 
                                    key={heartIndex} 
                                    className={`fas fa-heart text-xs ${
                                        heartIndex <= (lives ?? 3) ? 'text-rose-500' : 'text-gray-300 dark:text-gray-600'
                                    }`}
                                ></i>
                            ))}
                        </div>

                        <p className="opacity-80 text-xs sm:text-sm mb-6 text-gray-600 dark:text-gray-300 leading-relaxed">
                            {message || "Jawabanmu belum tepat. Nyawa berkurang 1! Ayo periksa kembali hitunganmu dan coba lagi."}
                        </p>
                        <button 
                            onClick={() => { playAudioTone('click'); onRetry(); }} 
                            className="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-rotate-left"></i> Coba Lagi
                        </button>
                    </div>
                </div>
            );
        };

        const GameOverPopup = ({ onRestart, onHome }) => {
            useEffect(() => {
                playAudioTone('error');
            }, []);

            return (
                <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center z-50 fade-in p-4">
                    <div className="bg-white dark:bg-gray-800 rounded-3xl p-7 sm:p-8 max-w-sm w-full text-center shadow-2xl border-4 border-rose-600/80">
                        <div className="w-20 h-20 bg-rose-100 dark:bg-rose-950/70 rounded-full mx-auto mb-4 flex items-center justify-center text-4xl text-rose-600 bounce-slight ring-4 ring-rose-300 dark:ring-rose-800">
                            <i className="fas fa-heart-crack"></i>
                        </div>
                        <h2 className="text-2xl sm:text-3xl font-serif font-black mb-2 text-gray-900 dark:text-white">Game Over!</h2>
                        <p className="opacity-80 text-xs sm:text-sm mb-6 text-gray-600 dark:text-gray-300 leading-relaxed">
                            Kesempatan 3 nyawa investigasi Anda telah habis. Sindikat tengkulak berhasil memanipulasi pasar! Evaluasi analisismu dan mulai kembali dari awal.
                        </p>
                        <div className="flex flex-col gap-3">
                            <button 
                                onClick={() => { playAudioTone('click'); onRestart(); }} 
                                className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg transition-transform transform active:scale-95 flex items-center justify-center gap-2"
                            >
                                <i className="fas fa-rotate-right"></i> Mulai dari Awal (3 Nyawa)
                            </button>
                            <button 
                                onClick={() => { playAudioTone('click'); onHome(); }} 
                                className="w-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-bold py-3 px-6 rounded-2xl transition-all active:scale-95 flex items-center justify-center gap-2 text-sm"
                            >
                                <i className="fas fa-house"></i> Kembali ke Menu Utama
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Level1 = ({ state, completeLevel, loseLife }) => {
            const [showMaterial, setShowMaterial] = useState(true);
            const [prob, setProb] = useState(null);
            const [leftW, setLeftW] = useState(0);
            const [rightW, setRightW] = useState(0);
            const [isSuccess, setIsSuccess] = useState(false);
            const [showWrong, setShowWrong] = useState(false);
            const reg = REGIONS[state.region];

            useEffect(() => {
                const a = Math.floor(Math.random() * 5) + 2;
                const x = Math.floor(Math.random() * 5) + 3;
                const b = x + a;
                setProb({ a, x, b });
                setLeftW(a);
                setRightW(b);
            }, []);

            if (showMaterial) {
                return (
                    <MaterialCard 
                        levelNum={1}
                        title="Kalibrasi Timbangan (x ± a = b)"
                        subtitle="Konsep Kesetaraan & Prinsip Keseimbangan Timbangan"
                        concept="Persamaan linear bekerja persis seperti timbangan dua lengan. Ruas kiri dan ruas kanan harus selalu bernilai sama. Jika kamu menambah atau mengurangi beban di salah satu ruas, kamu wajib melakukan hal yang sama persis di ruas lainnya agar timbangan tetap seimbang."
                        steps={[
                            "Identifikasi variabel misterius (x) dan beban tambahan pada ruas yang sama.",
                            "Kurangkan beban tambahan tersebut dari kedua ruas secara bersamaan.",
                            "Ketika hanya tersisa variabel (x) di ruas kiri, nilai di ruas kanan adalah jawabannya."
                        ]}
                        example="Jika x + 4 = 9, kurangi kedua ruas dengan 4: x + 4 - 4 = 9 - 4, sehingga diperoleh x = 5."
                        tips="Gunakan tombol pengurang di kedua sisi secara imbang untuk menjaga keseimbangan jarum timbangan."
                        onStart={() => setShowMaterial(false)}
                    />
                );
            }

            if (!prob) return null;

            const isBalanced = (leftW + prob.x) === rightW;
            const isDone = isBalanced && leftW === 0;

            const handleDrop = (side) => {
                playAudioTone('click');
                if (side === 'left' && leftW > 0) setLeftW(l => l - 1);
                if (side === 'right' && rightW > 0) setRightW(r => r - 1);
                if (side === 'both' && leftW > 0 && rightW > 0) {
                    setLeftW(l => l - 1);
                    setRightW(r => r - 1);
                }
            };

            const handleReset = () => {
                playAudioTone('click');
                if (prob) {
                    setLeftW(prob.a);
                    setRightW(prob.b);
                }
            };

            const handleCheck = () => {
                if (isDone) {
                    playAudioTone('success');
                    setIsSuccess(true);
                } else {
                    loseLife();
                    setShowWrong(true);
                }
            };

            return (
                <div className="max-w-3xl mx-auto p-4 flex flex-col min-h-[80vh] fade-in relative">
                    <div className="flex justify-between items-center mb-2">
                        <h2 className="text-2xl font-serif font-bold">Los Sayur ({reg.commodity})</h2>
                        <button 
                            onClick={() => { playAudioTone('click'); setShowMaterial(true); }} 
                            className="text-xs bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold hover:bg-emerald-200 transition"
                        >
                            <i className="fas fa-book-open mr-1"></i> Buka Materi
                        </button>
                    </div>

                    <p className="opacity-80 mb-6 bg-white/60 dark:bg-gray-800/60 p-3.5 rounded-2xl border dark:border-gray-700 text-sm">
                        "Timbangan pedagang ini dimanipulasi! Di lengan kiri ada 1 karung misterius (<MathVar>x</MathVar>) dan beban <MathVar>{prob.a}</MathVar> kg. Lengan kanan ada beban <MathVar>{prob.b}</MathVar> kg. Buang beban dari kedua sisi secara setara agar timbangan seimbang dan kita tahu berat karung rahasia (<MathVar>x</MathVar>)."
                    </p>

                    <div className="text-center text-xl font-bold mb-6 font-mono bg-white dark:bg-gray-800 p-3 rounded-2xl shadow-sm w-fit mx-auto border border-gray-200 dark:border-gray-700">
                        <MathVar>x</MathVar> + {leftW} = {rightW}
                    </div>

                    <div className="flex-1 flex flex-col items-center justify-center mb-8 relative">
                        <div className={`w-full max-w-md h-2.5 bg-gray-800 dark:bg-gray-400 rounded-full relative transition-transform duration-500 
                            ${!isBalanced ? (leftW + prob.x > rightW ? 'rotate-3' : '-rotate-3') : 'rotate-0'}`}>
                            
                            <div className="absolute left-4 top-0 w-24 h-24 border-b-2 border-l-2 border-r-2 border-gray-400 rounded-b-xl flex items-end justify-center pb-2 px-1 gap-1">
                                <div className="w-10 h-12 bg-emerald-600 text-white rounded-lg flex items-center justify-center font-bold text-sm shadow-md">
                                    <MathVar>x</MathVar>
                                </div>
                                {leftW > 0 && (
                                    <div className="w-8 h-8 bg-gray-500 text-white rounded-full flex items-center justify-center font-bold text-xs shadow-md">
                                        {leftW}kg
                                    </div>
                                )}
                            </div>

                            <div className="absolute right-4 top-0 w-24 h-24 border-b-2 border-l-2 border-r-2 border-gray-400 rounded-b-xl flex items-end justify-center pb-2">
                                <div className="w-12 h-12 bg-gray-500 text-white rounded-full flex items-center justify-center font-bold text-sm shadow-md">
                                    {rightW}kg
                                </div>
                            </div>
                            
                            <div className="absolute left-1/2 top-2 -ml-3 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-b-[24px] border-b-gray-800 dark:border-b-gray-400"></div>
                        </div>

                        <div className="flex flex-wrap justify-center items-center gap-3 sm:gap-4 mt-24">
                            <button onClick={() => handleDrop('left')} disabled={leftW===0} className="px-3.5 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800 font-semibold disabled:opacity-30 hover:bg-red-200 dark:hover:bg-red-900/50 transition active:scale-95 text-xs sm:text-sm">
                                <i className="fas fa-minus mr-1"></i> 1kg Kiri
                            </button>
                            <button onClick={() => handleDrop('both')} disabled={leftW===0 || rightW===0} className="px-4 py-2.5 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 rounded-xl border border-emerald-300 dark:border-emerald-800 font-bold disabled:opacity-30 hover:bg-emerald-200 dark:hover:bg-emerald-900 transition active:scale-95 text-xs sm:text-sm flex items-center gap-1.5 shadow-sm">
                                <i className="fas fa-arrows-split-up-and-left rotate-90"></i> Kurang 1kg Kedua Ruas
                            </button>
                            <button onClick={() => handleDrop('right')} disabled={rightW===0} className="px-3.5 py-2 bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 rounded-xl border border-red-200 dark:border-red-800 font-semibold disabled:opacity-30 hover:bg-red-200 dark:hover:bg-red-900/50 transition active:scale-95 text-xs sm:text-sm">
                                <i className="fas fa-minus mr-1"></i> 1kg Kanan
                            </button>
                            <button 
                                onClick={handleReset} 
                                className="px-3.5 py-2 bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 rounded-xl border border-amber-300 dark:border-amber-700 font-semibold hover:bg-amber-200 dark:hover:bg-amber-900/60 transition flex items-center gap-1 shadow-sm active:scale-95 text-xs sm:text-sm"
                                title="Kembalikan timbangan ke posisi awal"
                            >
                                <i className="fas fa-rotate-left"></i> Reset
                            </button>
                        </div>
                    </div>

                    <div className="text-center fade-in">
                        {isDone ? (
                            <div>
                                <p className="text-emerald-600 dark:text-emerald-400 font-bold text-xl mb-4">Timbangan Seimbang Sempurna! <MathVar>x</MathVar> = {rightW}</p>
                                <button onClick={() => { playAudioTone('success'); setIsSuccess(true); }} className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3.5 rounded-2xl font-bold shadow-lg transition active:scale-95">
                                    Amankan Bukti
                                </button>
                            </div>
                        ) : (
                            <div>
                                <p className={`font-bold text-xs sm:text-sm mb-3 ${isBalanced ? 'text-emerald-500' : 'text-gray-500 dark:text-gray-400'}`}>
                                    {isBalanced ? "Kedua lengan seimbang! Namun, bersihkan beban di kiri hingga tersisa karung x saja." : "Timbangan belum seimbang. Sesuaikan beban pada kedua ruas."}
                                </p>
                                <button onClick={handleCheck} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-md transition active:scale-95 text-xs sm:text-sm">
                                    Periksa Keseimbangan
                                </button>
                            </div>
                        )}
                    </div>

                    {isSuccess && <SuccessPopup levelNum={1} onContinue={() => completeLevel(1)} />}
                    {showWrong && (
                        <WrongPopup 
                            title="Timbangan Belum Kalibrasi!"
                            message={`Lengan timbangan belum seimbang atau karung x belum terisolasi. Ingat: kurangkan kedua ruas dengan ${prob.a} kg agar tersisa x = ${prob.x} kg.`}
                            lives={state.lives}
                            onRetry={() => {
                                handleReset();
                                setShowWrong(false);
                            }}
                        />
                    )}
                </div>
            );
        };

        const Level2 = ({ state, completeLevel, loseLife }) => {
            const [showMaterial, setShowMaterial] = useState(true);
            const [prob, setProb] = useState(null);
            const [ans, setAns] = useState("");
            const [isSuccess, setIsSuccess] = useState(false);
            const [showWrong, setShowWrong] = useState(false);
            const reg = REGIONS[state.region];

            useEffect(() => {
                const a = Math.floor(Math.random() * 3) + 3;
                const x = (Math.floor(Math.random() * 5) + 2) * 10;
                setProb({ a, x, b: a * x });
            }, []);

            if (showMaterial) {
                return (
                    <MaterialCard 
                        levelNum={2}
                        title="Pengelompokan Barang (ax = b)"
                        subtitle="Konsep Perkalian & Pembagian pada Kedua Ruas"
                        concept="Jika beberapa barang sejenis (koefisien a) bernilai total b, maka harga 1 barang (variabel y) diperoleh dengan membagi kedua ruas dengan koefisien barang tersebut."
                        steps={[
                            "Tuliskan persamaan dalam bentuk koefisien dikali variabel sama dengan total: a · y = b.",
                            "Bagi kedua ruas dengan angka koefisien (a).",
                            "Hasil bagi di ruas kanan adalah nilai satuan variabel (y)."
                        ]}
                        example="Jika 4y = 120, maka y = 120 ÷ 4 = 30."
                        tips="Operasi kebalikan dari perkalian adalah pembagian. Bagi total koin dengan jumlah tumpukan barang."
                        onStart={() => setShowMaterial(false)}
                    />
                );
            }

            if (!prob) return null;

            const checkAns = () => {
                if (parseInt(ans, 10) === prob.x) {
                    playAudioTone('success');
                    setIsSuccess(true);
                } else {
                    loseLife();
                    setShowWrong(true);
                    setAns("");
                }
            };

            return (
                <div className="max-w-3xl mx-auto p-4 flex flex-col min-h-[80vh] fade-in">
                    <div className="flex justify-between items-center mb-2">
                        <h2 className="text-2xl font-serif font-bold">Kios Grosir</h2>
                        <button 
                            onClick={() => { playAudioTone('click'); setShowMaterial(true); }} 
                            className="text-xs bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold hover:bg-emerald-200 transition"
                        >
                            <i className="fas fa-book-open mr-1"></i> Buka Materi
                        </button>
                    </div>

                    <p className="opacity-80 mb-6 bg-white/60 dark:bg-gray-800/60 p-3.5 rounded-2xl border dark:border-gray-700 text-sm">
                        "Tengkulak menyembunyikan harga satuan! Ada <MathVar>{prob.a}</MathVar> tumpukan {reg.commodity} dengan total nilai <MathVar>{prob.b}</MathVar> {reg.currency}. Jika <MathVar>{prob.a}y = {prob.b}</MathVar>, berapa harga 1 tumpukan (<MathVar>y</MathVar>)?"
                    </p>

                    <div className="flex-1 flex flex-col items-center justify-center gap-8">
                        <div className="flex gap-4 flex-wrap justify-center">
                            {Array.from({length: prob.a}).map((_, i) => (
                                <div key={i} className="w-16 h-16 bg-amber-100 dark:bg-amber-900/70 border-2 border-amber-300 dark:border-amber-700 rounded-2xl flex items-center justify-center text-2xl shadow-sm relative">
                                    <i className="fas fa-box text-amber-600 dark:text-amber-400"></i>
                                    <span className="absolute -bottom-2 -right-2 bg-white dark:bg-gray-800 text-xs font-bold px-1.5 py-0.5 rounded shadow border dark:border-gray-700"><MathVar>y</MathVar></span>
                                </div>
                            ))}
                        </div>
                        <div className="text-3xl font-bold opacity-50">=</div>
                        <div className="flex items-center gap-2 bg-yellow-100 dark:bg-yellow-900/30 px-6 py-4 rounded-2xl border border-yellow-300 dark:border-yellow-700 shadow-inner">
                            <i className="fas fa-coins text-yellow-500 text-2xl"></i>
                            <span className="text-2xl font-bold font-mono">{prob.b}</span>
                        </div>

                        <div className="flex flex-col sm:flex-row gap-4 items-center mt-4">
                            <div className="flex items-center gap-2">
                                <span className="font-bold text-lg"><MathVar>y</MathVar> = </span>
                                <input 
                                    type="number" value={ans} onChange={e => setAns(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && checkAns()}
                                    className="w-28 p-3 text-center font-bold text-xl rounded-xl border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:border-emerald-500 shadow-inner"
                                    placeholder="?"
                                />
                            </div>
                            <button onClick={checkAns} disabled={!ans} className="bg-emerald-600 hover:bg-emerald-700 text-white px-7 py-3.5 rounded-xl font-bold disabled:opacity-40 shadow transition active:scale-95">
                                Jawab
                            </button>
                        </div>
                    </div>
                    {isSuccess && <SuccessPopup levelNum={2} onContinue={() => completeLevel(2)} />}
                    {showWrong && (
                        <WrongPopup 
                            title="Harga Belum Tepat!"
                            message={`Hitunganmu belum pas. Ingat modelnya: ${prob.a}y = ${prob.b}, maka harga 1 tumpukan adalah y = ${prob.b} ÷ ${prob.a}.`}
                            lives={state.lives}
                            onRetry={() => setShowWrong(false)}
                        />
                    )}
                </div>
            );
        };

        const Level3 = ({ state, completeLevel, loseLife }) => {
            const [showMaterial, setShowMaterial] = useState(true);
            const [prob, setProb] = useState(null);
            const [ans, setAns] = useState("");
            const [isSuccess, setIsSuccess] = useState(false);
            const [showWrong, setShowWrong] = useState(false);
            const [chats, setChats] = useState([]);
            const chatEndRef = useRef(null);

            useEffect(() => {
                const a = Math.floor(Math.random() * 2) + 2;
                const x = (Math.floor(Math.random() * 4) + 2) * 10;
                const b = (Math.floor(Math.random() * 3) + 1) * 5;
                const c = (a * x) - b;
                setProb({ a, x, b, c });
                
                setChats([
                    { sender: 'npc', text: "Kamu cari Buku Catatan Hitam sindikat? Aku punya infonya." },
                    { sender: 'npc', text: `Dengar baik-baik: ${a} kali lipat harga buku itu, jika dikurangi hutangku ${b} koin, hasilnya pas ${c} koin.` },
                    { sender: 'npc', text: `Berarti modelnya: ${a}x - ${b} = ${c}. Berapa koin (x) harga sebenarnya?` }
                ]);
            }, []);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [chats]);

            if (showMaterial) {
                return (
                    <MaterialCard 
                        levelNum={3}
                        title="Negosiasi Harga (ax ± b = c)"
                        subtitle="Penyelesaian PLSV Kombinasi Dua Langkah"
                        concept="Bentuk ini memadukan operasi perkalian dengan penjumlahan atau pengurangan. Untuk mencari nilai x, kita harus menyelesaikan operasi penjumlahan/pengurangan terlebih dahulu, baru kemudian pembagian."
                        steps={[
                            "Langkah 1: Hilangkan konstanta (±b) dengan menambahkan atau mengurangkan kedua ruas dengan nilai b yang berlawanan tanda.",
                            "Langkah 2: Setelah tersisa ax = konstanta baru, bagi kedua ruas dengan nilai a untuk menemukan x."
                        ]}
                        example={"Jika 2x - 10 = 50, maka:\n1. 2x = 50 + 10 = 60\n2. x = 60 ÷ 2 = 30."}
                        tips="Ingat urutan: selalu bereskan suku konstanta bebas terlebih dahulu sebelum membagi koefisien variabel."
                        onStart={() => setShowMaterial(false)}
                    />
                );
            }

            if (!prob) return null;

            const handleSend = () => {
                if (!ans.trim()) return;
                playAudioTone('click');
                const val = parseInt(ans.trim(), 10);
                const newChats = [...chats, { sender: 'player', text: `Aku tawar ${val} koin.` }];
                setChats(newChats);
                setAns("");

                setTimeout(() => {
                    if (val === prob.x) {
                        playAudioTone('success');
                        setChats(c => [...c, { sender: 'npc', text: "Cerdas! Ini bukunya. Lanjutkan penyelidikanmu." }]);
                        setTimeout(() => setIsSuccess(true), 1200);
                    } else {
                        loseLife();
                        setChats(c => [...c, { sender: 'npc', text: "Salah hitung! Periksa kembali persamaannya: " + prob.a + "x - " + prob.b + " = " + prob.c }]);
                        setShowWrong(true);
                    }
                }, 700);
            };

            return (
                <div className="max-w-md mx-auto h-[80vh] flex flex-col bg-white dark:bg-gray-900 rounded-3xl overflow-hidden border border-gray-200 dark:border-gray-800 shadow-2xl relative">
                    <div className="bg-gray-100 dark:bg-gray-800 p-4 border-b dark:border-gray-700 flex items-center justify-between shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-gray-300 dark:bg-gray-600 rounded-full flex items-center justify-center text-gray-600 dark:text-gray-300">
                                <i className="fas fa-user-secret"></i>
                            </div>
                            <div>
                                <h3 className="font-bold text-sm text-gray-900 dark:text-white">Informan Pasar</h3>
                                <span className="text-xs text-emerald-500 font-bold">Online</span>
                            </div>
                        </div>
                        <button 
                            onClick={() => { playAudioTone('click'); setShowMaterial(true); }}
                            className="text-xs bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold hover:bg-emerald-200 transition"
                        >
                            <i className="fas fa-book-open mr-1"></i> Materi
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4 bg-[#e5ddd5] dark:bg-gray-950 relative">
                        {chats.map((chat, i) => (
                            <div key={i} className={`flex ${chat.sender === 'player' ? 'justify-end' : 'justify-start'} fade-in`}>
                                <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs sm:text-sm shadow-sm relative ${
                                    chat.sender === 'player' 
                                        ? 'bg-emerald-600 text-white rounded-br-none font-medium' 
                                        : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 rounded-tl-none border border-gray-200 dark:border-gray-700'
                                }`}>
                                    {chat.text}
                                </div>
                            </div>
                        ))}
                        <div ref={chatEndRef} />
                    </div>

                    <div className="p-3 bg-gray-100 dark:bg-gray-800 flex gap-2 border-t dark:border-gray-700">
                        <input 
                            type="number" value={ans} onChange={e => setAns(e.target.value)}
                            onKeyDown={e => e.key === 'Enter' && handleSend()}
                            placeholder="Ketik tawaran (x)..."
                            className="flex-1 p-3 rounded-full border-none focus:ring-2 focus:ring-emerald-500 bg-white dark:bg-gray-700 outline-none text-xs sm:text-sm shadow-inner"
                            disabled={isSuccess}
                        />
                        <button onClick={handleSend} disabled={!ans.trim() || isSuccess} className="w-12 h-12 bg-emerald-600 hover:bg-emerald-700 rounded-full text-white flex items-center justify-center disabled:opacity-40 transition active:scale-95 shadow">
                            <i className="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    {isSuccess && <SuccessPopup levelNum={3} onContinue={() => completeLevel(3)} />}
                    {showWrong && (
                        <WrongPopup 
                            title="Tawaran Ditolak!"
                            message={`Informan menolak tawaranmu. Selesaikan persamaannya: ${prob.a}x - ${prob.b} = ${prob.c}.`}
                            lives={state.lives}
                            onRetry={() => setShowWrong(false)}
                        />
                    )}
                </div>
            );
        };

        const Level4 = ({ state, completeLevel, loseLife }) => {
            const [showMaterial, setShowMaterial] = useState(true);
            const [prob, setProb] = useState(null);
            const [subVarCount, setSubVarCount] = useState(0);
            const [subConstApplied, setSubConstApplied] = useState(false);
            const [selectedConstChoice, setSelectedConstChoice] = useState(null);
            const [constFeedback, setConstFeedback] = useState("");
            const [ans, setAns] = useState("");
            const [isSuccess, setIsSuccess] = useState(false);
            const [showWrong, setShowWrong] = useState(false);
            const [wrongMsg, setWrongMsg] = useState("");
            const [shuffledOptions, setShuffledOptions] = useState([]);

            useEffect(() => {
                const a = Math.floor(Math.random() * 2) + 3;
                const c = Math.floor(Math.random() * 2) + 1;
                const x = Math.floor(Math.random() * 5) + 3;
                const b = Math.floor(Math.random() * 6) + 4;
                const d = (a * x) + b - (c * x);
                
                setProb({ a, b, c, d, x });
                setSubVarCount(0);
                setSubConstApplied(false);
                setSelectedConstChoice(null);
                setConstFeedback("");
                setAns("");

                const opts = [b, b + 2, Math.max(1, b - 3)].sort(() => Math.random() - 0.5);
                setShuffledOptions(opts);
            }, []);

            if (showMaterial) {
                return (
                    <MaterialCard 
                        levelNum={4}
                        title="Adu Bukti Gudang (ax + b = cx + d)"
                        subtitle="Variabel di Kedua Ruas & Konsep Kesetaraan Operasi"
                        concept="Menyelesaikan persamaan dengan variabel di kedua ruas berlandaskan pada Prinsip Kesetaraan (Equivalence). Jika kamu mengurangkan suatu nilai di ruas kanan, maka ruas kiri WAJIB dikurangkan dengan nilai yang sama persis agar neraca persamaan tetap bernilai seimbang dan adil."
                        steps={[
                            "Langkah 1 (Mengurangkan Variabel di Kedua Ruas): Kurangkan suku variabel di kedua ruas secara bersamaan hingga ruas kanan bersih dari variabel.",
                            "Langkah 2 (Mengurangkan Konstanta di Kedua Ruas): Pilih konstanta pengurang yang tepat untuk dimasukkan ke ruas kiri dan ruas kanan.",
                            "Langkah 3 (Mencari Nilai Variabel): Bagi sisa konstanta dengan koefisien variabel yang tersisa."
                        ]}
                        example={"Jika 3a + 6 = 1a + 16:\n1. Kedua ruas sama-sama dikurang 1a ➔ 2a + 6 = 16\n2. Kedua ruas sama-sama dikurang 6 ➔ 2a = 10\n3. Kedua ruas dibagi 2 ➔ a = 5."}
                        tips="Kaidah Emas Matematika: 'Apa yang dilakukan pada satu ruas, harus dilakukan pada ruas lainnya (Kiri dikurang ➔ Kanan juga dikurang)'."
                        onStart={() => setShowMaterial(false)}
                    />
                );
            }

            if (!prob) return null;

            const currentLeftVar = prob.a - subVarCount;
            const currentRightVar = prob.c - subVarCount;
            const isVarCleared = currentRightVar === 0;
            const currentLeftConst = subConstApplied ? 0 : prob.b;
            const currentRightConst = subConstApplied ? (prob.d - prob.b) : prob.d;

            const handleSubtractVarBothSides = () => {
                if (subVarCount < prob.c) {
                    playAudioTone('click');
                    setSubVarCount(prev => prev + 1);
                }
            };

            const handleApplyConst = (val) => {
                setSelectedConstChoice(val);
                if (val === prob.b) {
                    playAudioTone('success');
                    setSubConstApplied(true);
                    setConstFeedback("");
                } else {
                    loseLife();
                    const msg = `Kurang tepat! Untuk menghilangkan angka ${prob.b} di ruas kiri, kedua ruas harus sama-sama dikurangi ${prob.b}.`;
                    setConstFeedback(msg);
                    setWrongMsg(msg);
                    setShowWrong(true);
                }
            };

            const checkFinalAns = () => {
                if (parseInt(ans, 10) === prob.x) {
                    playAudioTone('success');
                    setIsSuccess(true);
                } else {
                    loseLife();
                    setWrongMsg(`Nilai a belum tepat. Bagi sisa beban ruas kanan dengan koefisien: ${currentRightConst} ÷ ${currentLeftVar}.`);
                    setShowWrong(true);
                    setAns("");
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-4 flex flex-col min-h-[80vh] fade-in">
                    <div className="flex justify-between items-center mb-2">
                        <h2 className="text-2xl font-serif font-bold">Gudang Penyimpanan Sindikat</h2>
                        <button 
                            onClick={() => { playAudioTone('click'); setShowMaterial(true); }} 
                            className="text-xs bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold hover:bg-emerald-200 transition"
                        >
                            <i className="fas fa-book-open mr-1"></i> Buka Materi
                        </button>
