                    </div>

                    <div className="bg-white dark:bg-gray-800 p-4 sm:p-5 rounded-3xl shadow-md border-2 border-emerald-500/40 mb-6 text-center">
                        <span className="text-xs uppercase tracking-wider font-extrabold text-emerald-600 dark:text-emerald-400 block mb-1">
                            Persamaan Neraca Gudang
                        </span>
                        <div className="text-2xl sm:text-3xl font-mono font-bold text-gray-800 dark:text-gray-100">
                            {prob.a}<MathVar>a</MathVar> + {prob.b} = {prob.c}<MathVar>a</MathVar> + {prob.d}
                        </div>
                        <p className="text-xs text-gray-500 dark:text-gray-400 mt-2">
                            Gunakan tombol di bawah untuk mengurangkan suku yang sama pada <b>kedua ruas secara adil</b>.
                        </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                        <div className="bg-blue-50/70 dark:bg-slate-800/80 rounded-2xl p-4 border-2 border-blue-200 dark:border-blue-900/50 flex flex-col justify-between shadow-sm">
                            <div>
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs font-bold uppercase tracking-wider text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-950 px-2.5 py-1 rounded-lg">
                                        Ruas Kiri
                                    </span>
                                    <span className="font-mono text-sm font-bold text-gray-700 dark:text-gray-300">
                                        {currentLeftVar > 0 ? `${currentLeftVar}a` : ''} 
                                        {currentLeftConst > 0 ? ` + ${currentLeftConst}` : (currentLeftVar === 0 ? '0' : '')}
                                    </span>
                                </div>

                                <div className="flex flex-wrap gap-2 mb-3 min-h-[52px] items-center">
                                    {Array.from({ length: currentLeftVar }).map((_, i) => (
                                        <div key={`left-a-${i}`} className="w-11 h-11 bg-blue-600 text-white rounded-xl flex items-center justify-center font-bold shadow text-base">
                                            <MathVar>a</MathVar>
                                        </div>
                                    ))}
                                    {subVarCount > 0 && !isVarCleared && (
                                        <div className="w-11 h-11 bg-red-500 text-white rounded-xl flex items-center justify-center font-bold shadow text-xs animate-pulse">
                                            -<MathVar>a</MathVar>
                                        </div>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white dark:bg-gray-700 p-2.5 rounded-xl border border-blue-200 dark:border-gray-600 flex justify-between items-center text-xs font-bold">
                                <span>Konstanta Kiri:</span>
                                <span className={subConstApplied ? 'line-through text-red-500' : 'text-blue-600 dark:text-blue-400'}>
                                    {prob.b} kg {subConstApplied && `(-${prob.b} = 0)`}
                                </span>
                            </div>
                        </div>

                        <div className="bg-amber-50/70 dark:bg-slate-800/80 rounded-2xl p-4 border-2 border-amber-200 dark:border-amber-900/50 flex flex-col justify-between shadow-sm">
                            <div>
                                <div className="flex justify-between items-center mb-3">
                                    <span className="text-xs font-bold uppercase tracking-wider text-amber-700 dark:text-amber-300 bg-amber-100 dark:bg-amber-950 px-2.5 py-1 rounded-lg">
                                        Ruas Kanan
                                    </span>
                                    <span className="font-mono text-sm font-bold text-gray-700 dark:text-gray-300">
                                        {currentRightVar > 0 ? `${currentRightVar}a + ` : ''}{currentRightConst}
                                    </span>
                                </div>

                                <div className="flex flex-wrap gap-2 mb-3 min-h-[52px] items-center">
                                    {Array.from({ length: currentRightVar }).map((_, i) => (
                                        <div key={`right-a-${i}`} className="w-11 h-11 bg-amber-600 text-white rounded-xl flex items-center justify-center font-bold shadow text-base">
                                            <MathVar>a</MathVar>
                                        </div>
                                    ))}
                                    {currentRightVar === 0 && (
                                        <span className="text-xs font-bold text-emerald-600 dark:text-emerald-400 flex items-center gap-1.5 py-2">
                                            <i className="fas fa-check-circle"></i> Suku variabel kanan telah bersih!
                                        </span>
                                    )}
                                </div>
                            </div>

                            <div className="bg-white dark:bg-gray-700 p-2.5 rounded-xl border border-amber-200 dark:border-gray-600 flex justify-between items-center text-xs font-bold">
                                <span>Konstanta Kanan:</span>
                                <span>
                                    {subConstApplied ? `${prob.d} - ${prob.b} = ${prob.d - prob.b} kg` : `${prob.d} kg`}
                                </span>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-gray-800 p-5 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700 space-y-5">
                        {!isVarCleared && (
                            <div className="text-center space-y-3">
                                <div className="inline-flex items-center gap-2 bg-red-100 dark:bg-red-950/60 text-red-700 dark:text-red-300 px-3 py-1 rounded-full text-xs font-bold">
                                    <i className="fas fa-circle-minus"></i> Tahap 1: Kurangkan Variabel di Kedua Ruas
                                </div>
                                <p className="text-xs sm:text-sm text-gray-700 dark:text-gray-300 max-w-lg mx-auto">
                                    Klik tombol di bawah untuk mengurangkan <MathVar>a</MathVar> pada <b>ruas kiri</b> dan <b>ruas kanan</b> secara serentak (tersisa {prob.c - subVarCount} kali).
                                </p>
                                <button 
                                    onClick={handleSubtractVarBothSides}
                                    className="bg-red-600 hover:bg-red-700 active:scale-95 text-white font-bold py-3 px-8 rounded-2xl shadow-lg transition-all flex items-center gap-2.5 mx-auto text-sm sm:text-base group"
                                >
                                    <span className="w-6 h-6 rounded-full bg-white text-red-600 flex items-center justify-center font-black text-xs">
                                        -
                                    </span>
                                    <span>Kurang <MathVar>a</MathVar> di Kedua Ruas</span>
                                    <span className="text-xs bg-red-800 px-2 py-0.5 rounded-full">(-1a)</span>
                                </button>
                            </div>
                        )}

                        {isVarCleared && !subConstApplied && (
                            <div className="text-center space-y-3 fade-in">
                                <div className="inline-flex items-center gap-2 bg-amber-100 dark:bg-amber-950/60 text-amber-800 dark:text-amber-300 px-3 py-1 rounded-full text-xs font-bold">
                                    <i className="fas fa-cubes-stacked"></i> Tahap 2: Kurangkan Konstanta di Kedua Ruas
                                </div>
                                <p className="text-xs sm:text-sm text-gray-700 dark:text-gray-300 max-w-lg mx-auto">
                                    Persamaan sekarang: <span className="font-mono font-bold text-blue-600 dark:text-blue-400">{currentLeftVar}a + {prob.b} = {prob.d}</span>.
                                    Pilih nilai konstanta untuk dikurangkan dari kedua ruas:
                                </p>
                                
                                <div className="flex flex-wrap justify-center gap-3 pt-1">
                                    {shuffledOptions.map((optVal, idx) => (
                                        <button
                                            key={idx}
                                            onClick={() => handleApplyConst(optVal)}
                                            className={`py-2.5 px-6 rounded-2xl font-bold text-sm sm:text-base border-2 transition-all transform active:scale-95 flex items-center gap-2 shadow-sm
                                                ${selectedConstChoice === optVal && optVal !== prob.b
                                                    ? 'bg-red-100 border-red-500 text-red-700 dark:bg-red-950/50 dark:text-red-300'
                                                    : 'bg-red-600 hover:bg-red-700 border-red-700 text-white hover:shadow-md'}`}
                                        >
                                            <i className="fas fa-minus-circle"></i> Kurang {optVal} di Kedua Ruas
                                        </button>
                                    ))}
                                </div>

                                {constFeedback && (
                                    <p className="text-xs font-bold text-red-500 bg-red-50 dark:bg-red-950/40 p-2.5 rounded-xl border border-red-200 dark:border-red-900 max-w-md mx-auto fade-in">
                                        {constFeedback}
                                    </p>
                                )}
                            </div>
                        )}

                        {isVarCleared && subConstApplied && (
                            <div className="text-center space-y-4 fade-in">
                                <div className="inline-flex items-center gap-2 bg-emerald-100 dark:bg-emerald-950/60 text-emerald-800 dark:text-emerald-300 px-3 py-1 rounded-full text-xs font-bold">
                                    <i className="fas fa-calculator"></i> Tahap 3: Hitung Nilai Variabel Akhir
                                </div>
                                <div className="bg-emerald-50 dark:bg-emerald-950/30 p-3 rounded-2xl border border-emerald-200 dark:border-emerald-800 max-w-md mx-auto">
                                    <span className="text-xs text-gray-500 dark:text-gray-400 block mb-0.5">Persamaan Akhir yang Seimbang:</span>
                                    <span className="text-2xl font-mono font-bold text-emerald-700 dark:text-emerald-400">
                                        {currentLeftVar}<MathVar>a</MathVar> = {currentRightConst}
                                    </span>
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                                    <div className="flex items-center gap-2">
                                        <span className="font-bold text-lg text-gray-700 dark:text-gray-200"><MathVar>a</MathVar> = </span>
                                        <input 
                                            type="number" 
                                            value={ans} 
                                            onChange={e => setAns(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && checkFinalAns()}
                                            placeholder="?"
                                            className="w-24 p-3 text-center font-bold text-xl rounded-2xl border-2 border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 outline-none focus:border-emerald-500 shadow-inner"
                                        />
                                    </div>
                                    <button 
                                        onClick={checkFinalAns} 
                                        disabled={!ans} 
                                        className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white font-bold px-8 py-3.5 rounded-2xl shadow-lg transition-transform transform active:scale-95 text-sm sm:text-base flex items-center gap-2"
                                    >
                                        <i className="fas fa-stamp"></i> Buktikan Nilai <MathVar>a</MathVar>
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    {isSuccess && <SuccessPopup levelNum={4} onContinue={() => completeLevel(4)} />}
                    {showWrong && (
                        <WrongPopup 
                            title="Adu Bukti Kurang Tepat!"
                            message={wrongMsg}
                            lives={state.lives}
                            onRetry={() => setShowWrong(false)}
                        />
                    )}
                </div>
            );
        };

        const Level5 = ({ state, completeLevel, loseLife }) => {
            const [showMaterial, setShowMaterial] = useState(true);
            const [prob, setProb] = useState(null);
            const [eqInput, setEqInput] = useState("");
            const [ansInput, setAnsInput] = useState("");
            const [feedback, setFeedback] = useState("");
            const [isSuccess, setIsSuccess] = useState(false);
            const [showWrong, setShowWrong] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);
            const [videoEnded, setVideoEnded] = useState(false);

            useEffect(() => {
                const b = (Math.floor(Math.random() * 5) + 2) * 10;
                const x = (Math.floor(Math.random() * 5) + 3) * 10;
                const c = x + (x + b);
                setProb({ b, x, c });
            }, []);

            if (showMaterial) {
                return (
                    <MaterialCard 
                        levelNum={5}
                        title="Pemodelan Matematika (Boss Fight)"
                        subtitle="Menerjemahkan Masalah Nyata ke Persamaan Aljabar"
                        concept="Tantangan terakhir menguji kemampuanmu mengubah cerita verbal menjadi model aljabar simbolik. Tentukan apa yang dicari sebagai x, terjemahkan hubungan antarbenda, lalu bentuk persamaan totalnya."
                        steps={[
                            "Langkah 1: Misalkan hal yang belum diketahui sebagai variabel x (misal: Umur Gedung = x).",
                            "Langkah 2: Nyatakan objek lain berdasarkan x (misal: Pohon lebih tua b tahun ➔ x + b).",
                            "Langkah 3: Jumlahkan keduanya sesuai total cerita: x + (x + b) = Total, lalu cari nilai x."
                        ]}
                        example={"Jika umur gedung x dan beringin x + 20 dengan total 100:\nx + (x + 20) = 100 ➔ 2x + 20 = 100 ➔ 2x = 80 ➔ x = 40 tahun."}
                        tips="Tulis model persamaan dengan huruf 'x' kecil tanpa spasi berlebih, misalnya: x+(x+30)=110 atau 2x+30=110."
                        onStart={() => setShowMaterial(false)}
                    />
                );
            }

            if (!prob) return null;

            const checkFinal = () => {
                const eq = eqInput.toLowerCase().replace(/\s/g, '');
                const validEqs = [
                    `x+x+${prob.b}=${prob.c}`,
                    `x+(x+${prob.b})=${prob.c}`,
                    `2x+${prob.b}=${prob.c}`,
                    `(x+${prob.b})+x=${prob.c}`,
                    `x+${prob.b}+x=${prob.c}`,
                    `${prob.c}=2x+${prob.b}`,
                    `${prob.c}=x+(x+${prob.b})`,
                    `${prob.c}=x+x+${prob.b}`
                ];
                
                const isEqValid = validEqs.includes(eq);
                const isAnsValid = parseInt(ansInput, 10) === prob.x;

                if (isEqValid && isAnsValid) {
                    playAudioTone('success');
                    setIsSuccess(true);
                } else {
                    loseLife();
                    if (!isEqValid && isAnsValid) {
                        const msg = "Hasil angka benar, tetapi format model persamaannya belum tepat. Tuliskan dalam bentuk x + (x + " + prob.b + ") = " + prob.c;
                        setFeedback(msg);
                        setShowWrong(true);
                    } else if (isEqValid && !isAnsValid) {
                        const msg = "Model persamaan sudah benar! Periksa kembali hasil perhitungan akhirnya.";
                        setFeedback(msg);
                        setShowWrong(true);
                    } else {
                        const msg = "Model dan hasil masih kurang tepat. Ingat: x + (x + " + prob.b + ") = " + prob.c;
                        setFeedback(msg);
                        setShowWrong(true);
                    }
                }
            };

            return (
                <div className="max-w-2xl mx-auto p-4 sm:p-6 flex flex-col min-h-[80vh] fade-in items-center justify-center relative">
                    <div className="w-full flex justify-end items-center mb-2">
                        <button 
                            onClick={() => { playAudioTone('click'); setShowMaterial(true); }} 
                            className="text-xs bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold hover:bg-emerald-200 transition"
                        >
                            <i className="fas fa-book-open mr-1"></i> Buka Materi
                        </button>
                    </div>

                    <div className="w-20 h-20 bg-gray-800 text-yellow-500 rounded-full flex items-center justify-center text-4xl mb-4 shadow-xl border-4 border-gray-600">
                        <i className="fas fa-vault"></i>
                    </div>
                    
                    <h2 className="text-3xl font-serif font-bold mb-2 text-center text-gray-900 dark:text-white">Brankas Bos Tengkulak</h2>
                    <p className="text-center opacity-80 mb-6 text-xs sm:text-sm text-gray-600 dark:text-gray-300">"Boss Fight: Terjemahkan sandi kasus ini ke dalam bahasa aljabar!"</p>

                    <div className="bg-yellow-50 dark:bg-yellow-900/20 p-6 rounded-2xl shadow-inner border border-yellow-200 dark:border-yellow-700/50 w-full mb-8 relative font-serif text-base sm:text-lg leading-relaxed text-center text-gray-800 dark:text-gray-200">
                        <i className="fas fa-quote-left absolute top-4 left-4 text-gray-300 dark:text-gray-600 text-2xl"></i>
                        "Total umur gedung pasar dan pohon beringin tua adalah {prob.c} tahun. Pohon beringin itu {prob.b} tahun lebih tua dari gedung. Jika umur gedung adalah <MathVar>x</MathVar>, berapa umur gedung tersebut sebenarnya?"
                    </div>

                        <div className="w-full bg-white dark:bg-gray-800 p-5 sm:p-6 rounded-3xl shadow-lg border border-gray-200 dark:border-gray-700 mb-6 fade-in text-left">
                            <h3 className="font-bold text-base sm:text-lg border-b dark:border-gray-700 pb-3 mb-4 flex items-center gap-2 text-gray-800 dark:text-gray-100">
                                <i className="fas fa-graduation-cap text-emerald-600"></i> Pencapaian Tujuan Pembelajaran (TP):
                            </h3>
                            <ul className="space-y-3 text-xs sm:text-sm opacity-90">
                                <li className="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <i className="fas fa-check-circle text-emerald-500 mt-0.5 text-base"></i>
                                    <div><b>Level 1 (Timbangan):</b> Memahami konsep kesetaraan ruas kiri dan kanan (<MathVar>x ± a = b</MathVar>).</div>
                                </li>
                                <li className="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <i className="fas fa-check-circle text-emerald-500 mt-0.5 text-base"></i>
                                    <div><b>Level 2 (Grosir):</b> Mengoperasikan pembagian untuk menentukan koefisien tunggal (<MathVar>ax = b</MathVar>).</div>
                                </li>
                                <li className="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <i className="fas fa-check-circle text-emerald-500 mt-0.5 text-base"></i>
                                    <div><b>Level 3 (Warung Kopi):</b> Menyelesaikan PLSV kombinasi perkalian dan pengurangan (<MathVar>ax ± b = c</MathVar>).</div>
                                </li>
                                <li className="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <i className="fas fa-check-circle text-emerald-500 mt-0.5 text-base"></i>
                                    <div><b>Level 4 (Gudang):</b> Menguasai prinsip kesetaraan operasi pada kedua ruas (<MathVar>ax + b = cx + d</MathVar>).</div>
                                </li>
                                <li className="flex items-start gap-2.5 bg-gray-50 dark:bg-gray-700/30 p-2.5 rounded-xl border border-gray-100 dark:border-gray-700">
                                    <i className="fas fa-check-circle text-emerald-500 mt-0.5 text-base"></i>
                                    <div><b>Level 5 (Brankas Boss):</b> Menerjemahkan permasalahan kontekstual verbal menjadi model matematika.</div>
                                </li>
                            </ul>
                        </div>
                    )}

                    <p className="text-xs opacity-75 mb-6 text-gray-600 dark:text-gray-400">
                        Setiap sesi bermain ulang menggunakan <i>Procedural Generation</i> yang menghasilkan kombinasi angka baru.
                    </p>

                    <div className="flex flex-col sm:flex-row items-center justify-center gap-3.5 w-full max-w-md">
                        <button 
                            onClick={() => { playAudioTone('click'); resetGame(); }} 
                            className="w-full sm:flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-8 rounded-2xl text-base shadow-lg hover:shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center justify-center gap-2"
                        >
                            <i className="fas fa-rotate-right"></i> Main Lagi
                        </button>
                        
                        <button 
                            onClick={() => { playAudioTone('click'); setShowDaftarPustaka(true); }}
                            className="w-full sm:w-auto bg-white dark:bg-gray-800 hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-800 dark:text-gray-200 border-2 border-gray-300 dark:border-gray-600 font-bold py-4 px-6 rounded-2xl text-sm shadow-sm transition-all flex items-center justify-center gap-2 active:scale-95"
                        >
                            <i className="fas fa-book-bookmark text-emerald-500"></i> Daftar Pustaka
                        </button>
                    </div>

                    {showDaftarPustaka && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 fade-in">
                            <div className="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-3xl max-w-xl w-full shadow-2xl relative text-left max-h-[85vh] overflow-y-auto border border-gray-200 dark:border-gray-700">
                                <button 
                                    onClick={() => setShowDaftarPustaka(false)} 
                                    className="absolute top-5 right-5 text-gray-400 hover:text-red-500 text-xl transition"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                <div className="flex items-center gap-3 border-b dark:border-gray-700 pb-4 mb-4">
                                    <div className="w-10 h-10 rounded-xl bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg">
                                        <i className="fas fa-book-open-reader"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-xl font-bold font-serif text-gray-900 dark:text-white">Daftar Pustaka</h3>
                                        <p className="text-xs text-gray-500 dark:text-gray-400">Rujukan Kurikulum & Literatur Pembelajaran Matematika</p>
                                    </div>
                                </div>

                                <div className="space-y-4 text-xs sm:text-sm text-gray-700 dark:text-gray-300">
                                    {DAFTAR_PUSTAKA.map((item, idx) => (
                                        <div key={idx} className="p-3.5 bg-gray-50 dark:bg-gray-700/40 rounded-2xl border border-gray-200/80 dark:border-gray-600/60">
                                            <p className="font-semibold text-gray-900 dark:text-gray-100">{item.author} ({item.year}).</p>
                                            <p className="italic text-emerald-700 dark:text-emerald-400 mt-0.5">{item.title}.</p>
                                            <p className="text-gray-500 dark:text-gray-400 text-xs mt-0.5">{item.publisher}</p>
                                        </div>
                                    ))}
                                </div>

                                <button 
                                    onClick={() => setShowDaftarPustaka(false)}
                                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl mt-6 transition shadow active:scale-95"
                                >
                                    Tutup Rujukan
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [gameState, setGameState] = useState({
                screen: 'home',
                progress: 1,
                lives: 3,
                isGameOver: false,
                playerName: '',
                playerCipher: '',
                selectedChar: CHARACTERS[0],
                region: 'jawa',
                isDark: true,
                textSize: 'normal',
                isScratchpadOpen: false,
                isBgmPlaying: false
            });

            useEffect(() => {
                if (gameState.isDark) {
                    document.documentElement.classList.add('dark');
                    document.body.className = `dark-mode dark text-size-${gameState.textSize}`;
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.className = `text-size-${gameState.textSize}`;
                }
            }, [gameState.isDark, gameState.textSize]);

            useEffect(() => {
                if (gameState.screen === 'home') {
                    stopBgm();
                    if (gameState.isBgmPlaying) {
                        setGameState(s => ({ ...s, isBgmPlaying: false }));
                    }
                }
            }, [gameState.screen]);

            const changeScreen = (screenId) => {
                if (screenId === 'home') {
                    stopBgm();
                    setGameState(s => ({ ...s, screen: screenId, isBgmPlaying: false }));
                } else {
                    setGameState(s => ({ ...s, screen: screenId }));
                }
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const completeLevel = (levelNum) => {
                setGameState(s => {
                    const nextProgress = Math.max(s.progress, levelNum + 1);
                    return { ...s, progress: nextProgress, screen: levelNum === 5 ? 'ending' : 'map' };
                });
            };

            const loseLife = () => {
                setGameState(s => {
                    const nextLives = Math.max(0, (s.lives ?? 3) - 1);
                    if (nextLives <= 0) {
                        return { ...s, lives: 0, isGameOver: true };
                    }
                    return { ...s, lives: nextLives };
                });
            };

            const restartFromBeginning = () => {
                setGameState(s => ({
                    ...s,
                    progress: 1,
                    lives: 3,
                    isGameOver: false,
                    screen: 'l1'
                }));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const goToHome = () => {
                stopBgm();
                setGameState(s => ({
                    ...s,
                    progress: 1,
                    lives: 3,
                    isGameOver: false,
                    isBgmPlaying: false,
                    screen: 'home'
                }));
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const resetGame = () => {
                stopBgm();
                setGameState(s => ({ ...s, progress: 1, lives: 3, isGameOver: false, screen: 'home', isBgmPlaying: false }));
            };

            const renderScreen = () => {
                switch(gameState.screen) {
                    case 'home': return <Home changeScreen={changeScreen} state={gameState} setState={setGameState} />;
                    case 'story': return <Story changeScreen={changeScreen} />;
                    case 'char': return <CharSelect state={gameState} setState={setGameState} changeScreen={changeScreen} />;
                    case 'region': return <RegionSelect state={gameState} setState={setGameState} changeScreen={changeScreen} />;
                    case 'map': return <GameMap state={gameState} changeScreen={changeScreen} />;
                    case 'l1': return <Level1 state={gameState} completeLevel={completeLevel} loseLife={loseLife} />;
                    case 'l2': return <Level2 state={gameState} completeLevel={completeLevel} loseLife={loseLife} />;
                    case 'l3': return <Level3 state={gameState} completeLevel={completeLevel} loseLife={loseLife} />;
                    case 'l4': return <Level4 state={gameState} completeLevel={completeLevel} loseLife={loseLife} />;
                    case 'l5': return <Level5 state={gameState} completeLevel={completeLevel} loseLife={loseLife} />;
                    case 'ending': return <Ending state={gameState} resetGame={resetGame} />;
                    default: return <Home changeScreen={changeScreen} state={gameState} setState={setGameState} />;
                }
            };

            return (
                <div className={`min-h-screen relative flex flex-col font-sans transition-colors duration-300
                    ${gameState.screen !== 'home' && gameState.screen !== 'story' && gameState.screen !== 'char' && gameState.screen !== 'region' && gameState.screen !== 'map' && gameState.screen !== 'ending' 
                        ? (gameState.isDark ? REGIONS[gameState.region]?.darkBgClass : REGIONS[gameState.region]?.bgClass)
                        : ''}
                `}>
                    {gameState.screen !== 'home' && (
                        <GameHeader 
                            state={gameState} setState={setGameState} changeScreen={changeScreen}
                            title={gameState.screen.startsWith('l') ? `Level ${gameState.screen.charAt(1)}` : 'Investigasi Pasar'} 
                        />
                    )}
                    
                    <main className="flex-1 w-full z-10 pb-6 sm:pb-8 flex flex-col">
                        <div className="flex-1">
                            {renderScreen()}
                        </div>
                    </main>

                    {gameState.screen !== 'home' && (
                        <button 
                            onClick={() => {
                                playAudioTone('click');
                                setGameState(s => ({ ...s, isScratchpadOpen: true }));
                            }} 
                            className="fixed bottom-6 right-6 w-14 h-14 bg-yellow-500 hover:bg-yellow-400 text-white rounded-full shadow-2xl flex items-center justify-center text-xl z-40 transition-transform transform hover:scale-110 active:scale-95 border-2 border-yellow-600" 
                            title="Buku Catatan Hitung (Scratchpad)"
                        >
                            <i className="fas fa-pencil-alt"></i>
                        </button>
                    )}

                    <Scratchpad 
                        isOpen={gameState.isScratchpadOpen} 
                        onClose={() => setGameState(s => ({ ...s, isScratchpadOpen: false }))} 
                    />

                    {gameState.isGameOver && (
                        <GameOverPopup 
                            onRestart={restartFromBeginning} 
                            onHome={goToHome} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
